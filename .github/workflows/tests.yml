name: Validate AIFA workflow

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m aifa_pipeline build
      - run: python src/main.py report
      - uses: actions/upload-artifact@v4
        with:
          name: aifa-catalog-reports
          path: |
            results/reproduced/metrics.json
            results/reproduced/*.csv
